[workspace]
resolver = "3"
members = ["crates/champollion-rv", "crates/rvrun", "crates/softfloat"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
debug = "line-tables-only"

# The interpreter is unusably slow unoptimized; keep debug info but optimize the core.
[profile.dev.package.champollion-rv]
opt-level = 2
